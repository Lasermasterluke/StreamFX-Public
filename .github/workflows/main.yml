# Windows-only build of StreamFX that produces a downloadable, ready-to-install zip.
# Based on the project's own CI, updated for current GitHub Actions.

name: Build StreamFX for Windows

on:
  workflow_dispatch:
  push:
    branches: [ '*' ]

env:
  CMAKE_SYSTEM_VERSION: "10.0.20348.0"
  CMAKE_GENERATOR: "Visual Studio 17 2022"
  CMAKE_GENERATOR_PLATFORM: "x64"

jobs:
  windows:
    runs-on: windows-2022
    name: "Windows (MSVC)"
    steps:
    - name: "Clone"
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: "Gather Information"
      shell: bash
      run: |
        buildspec="${{ github.workspace }}/third-party/obs-studio/buildspec.json"
        IFS=$'\n' d=($(node tools/buildspec.js "${buildspec}" "prebuilt" "windows-x64"))
        echo "obs_deps_url=${d[2]}" >> "$GITHUB_ENV"
        IFS=$'\n' d=($(node tools/buildspec.js "${buildspec}" "qt6" "windows-x64"))
        echo "qt_url=${d[2]}" >> "$GITHUB_ENV"

    - name: "Dependency: Qt"
      shell: bash
      run: |
        curl --retry 5 --retry-delay 30 -jLo /tmp/qt.zip "${{ env.qt_url }}"
        mkdir -p "${{ github.workspace }}/build/qt"
        7z x -y -o"${{ github.workspace }}/build/qt" -- "/tmp/qt.zip"

    - name: "Dependency: Prebuilt OBS Studio Dependencies"
      shell: bash
      run: |
        curl --retry 5 --retry-delay 30 -jLo /tmp/obsdeps.zip "${{ env.obs_deps_url }}"
        mkdir -p "${{ github.workspace }}/build/obsdeps"
        7z x -y -o"${{ github.workspace }}/build/obsdeps" -- "/tmp/obsdeps.zip"

    - name: "Dependency: OBS Libraries"
      shell: bash
      run: |
        pushd "${{ github.workspace }}/third-party/obs-studio" > /dev/null
        for f in ../../patches/obs-studio/*.patch; do
          [ -e "$f" ] || continue
          echo "Applying patch '${f}'..."
          git apply "$f"
        done
        popd > /dev/null

        cmake \
          -S "${{ github.workspace }}/third-party/obs-studio" \
          -B "${{ github.workspace }}/build/obs" \
          -DCMAKE_SYSTEM_VERSION="${{ env.CMAKE_SYSTEM_VERSION }}" \
          -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/build/obs/install" \
          -DCMAKE_PREFIX_PATH="${{ github.workspace }}/build/obsdeps;${{ github.workspace }}/build/qt" \
          -DENABLE_PLUGINS=OFF \
          -DENABLE_UI=OFF \
          -DENABLE_SCRIPTING=OFF
        cmake --build "${{ github.workspace }}/build/obs" --config RelWithDebInfo --target obs-frontend-api
        cmake --install "${{ github.workspace }}/build/obs" --config RelWithDebInfo --component obs_libraries

    - name: "Configure StreamFX"
      shell: bash
      run: |
        cmake \
          -S "${{ github.workspace }}" \
          -B "${{ github.workspace }}/build/ci" \
          -DCMAKE_SYSTEM_VERSION="${{ env.CMAKE_SYSTEM_VERSION }}" \
          -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON \
          -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/dist" \
          -Dlibobs_DIR="${{ github.workspace }}/build/obs/install" \
          -DQt6_DIR="${{ github.workspace }}/build/qt" \
          -DFFmpeg_DIR="${{ github.workspace }}/build/obsdeps" \
          -DCURL_DIR="${{ github.workspace }}/build/obsdeps"

    - name: "Build StreamFX"
      shell: bash
      run: cmake --build "build/ci" --config RelWithDebInfo --target StreamFX

    - name: "Package"
      shell: bash
      run: |
        cmake --install "build/ci" --config RelWithDebInfo --prefix "${{ github.workspace }}/dist"
        echo "Packaged files:"
        find "${{ github.workspace }}/dist" -type f | head -50

    - name: "Upload"
      uses: actions/upload-artifact@v4
      with:
        name: StreamFX-Windows-x64
        path: dist/
        if-no-files-found: error
